name: wasi-nn debug

# TEMPORARY DEBUG WORKFLOW.
#
# Standalone, fast-feedback workflow to isolate a native crash
# (`STATUS_ILLEGAL_INSTRUCTION` / `0xc000001d`) seen in the wasi-nn tests on
# windows-2025. It mirrors the `test_wasi_nn` job from `main.yml` but:
#   - runs on its own so unrelated CI jobs don't slow feedback down,
#   - tests each backend in isolation via `--no-default-features`,
#   - serializes tests (`--test-threads=1`) and shows output (`--nocapture`) so
#     the last line before a crash names the exact failing test,
#   - sets `ONEDNN_VERBOSE=1` so OpenVINO's oneDNN logs the ISA/kernel it
#     dispatched right before any fault.
#
# Delete this file once the crash is diagnosed.
on:
  push:
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_wasi_nn:
    strategy:
      fail-fast: false
      # NOTE: use an include-only matrix so every job is defined explicitly and
      # GitHub does not merge entries. (A cross-product matrix plus an `include`
      # that only ADDS `onednn_max_isa` to an existing feature/os combination
      # gets MERGED into that combination instead of creating a new job, which
      # would silently delete the uncapped windows openvino lane and break the
      # A/B comparison below.)
      matrix:
        include:
          - { feature: openvino, os: ubuntu-24.04 }
          - { feature: onnx-download, os: ubuntu-24.04 }
          - { feature: onnx-download, os: windows-2025 }
          - { feature: winml, os: windows-2025 }
          # A/B experiment on windows openvino, both lanes explicit so both run:
          #   - uncapped: expected to crash (0xc000001d) on a bf16/AVX-512/AMX CPU
          #   - isa=AVX2: caps oneDNN so it can't JIT the bf16 kernels; expected
          #     to pass. If capped passes while uncapped crashes on the same CPU
          #     class, the crash is confirmed as oneDNN bf16 misdispatch (and the
          #     cap is the fix). ONEDNN_VERBOSE lets us verify the cap was honored.
          - { feature: openvino, os: windows-2025 }
          - { feature: openvino, os: windows-2025, onednn_max_isa: AVX2 }
    name: wasi-nn (${{ matrix.feature }}, ${{ matrix.os }}${{ matrix.onednn_max_isa && format(', isa={0}', matrix.onednn_max_isa) || '' }})
    runs-on: ${{ matrix.os }}
    env:
      ONEDNN_VERBOSE: 1
      ONEDNN_MAX_CPU_ISA: ${{ matrix.onednn_max_isa }}
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - uses: ./.github/actions/install-rust

    # Install OpenVINO
    - uses: abrown/install-openvino-action@v10
      if: runner.arch == 'X64'

    # Install WinML for testing wasi-nn WinML backend. WinML is only available
    # on Windows clients and Windows Server with desktop experience enabled.
    # GitHub Actions Window Server image doesn't have desktop experience
    # enabled, so we download the standalone library from ONNX Runtime project.
    - uses: nuget/setup-nuget@v2
      if: (runner.os == 'Windows') && (matrix.feature == 'winml')
    - run: nuget install Microsoft.AI.MachineLearning
      if: (runner.os == 'Windows') && (matrix.feature == 'winml')

    # Install Rust targets.
    - run: rustup target add wasm32-wasip1 wasm32-wasip2

    # Log the CPU the runner landed on; the crash is suspected to depend on the
    # (virtualized) CPU's advertised ISA.
    - name: Log runner CPU (Windows)
      if: runner.os == 'Windows'
      run: Get-CimInstance Win32_Processor | Format-List Name,Description,NumberOfCores,NumberOfLogicalProcessors
      shell: pwsh
    - name: Log runner CPU (Linux)
      if: runner.os == 'Linux'
      run: lscpu

    # Run the tests, serialized and unbuffered so the last line before a native
    # crash names the exact failing test. Filter by backend name so each job
    # runs only its own backend's tests (default features compile them all in).
    - run: cargo test -p wasmtime-wasi-nn --features ${{ matrix.feature }} -- ${{ matrix.feature == 'onnx-download' && 'onnx' || matrix.feature }} --test-threads=1 --nocapture
